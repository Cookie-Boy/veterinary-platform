networks:
  vet-network:
    driver: bridge

x-java-env: &java-env
  SPRING_PROFILES_ACTIVE: docker
  DB_HOST: ${REMOTE_HOST:-postgres}
  DB_PORT: ${REMOTE_HOST:+5432}
  SPRING_DATASOURCE_URL: jdbc:postgresql://${REMOTE_HOST:-postgres}:5432/vet-clinic
  SPRING_DATASOURCE_USERNAME: postgres
  SPRING_DATASOURCE_PASSWORD: 12345
  MONGO_HOST: ${REMOTE_HOST:-mongo}
  MONGO_PORT: 27017
  SPRING_REDIS_HOST: ${REMOTE_HOST:-redis}
  SPRING_REDIS_PORT: 6379
  GATEWAY_HOST: ${REMOTE_HOST:-vet-gateway}
  GATEWAY_PORT: 8888
  KEYCLOAK_ISSUER_URI: http://192.168.1.114:8080/realms/clinic-realm

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vet-clinic
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
    ports:
      - "5010:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - vet-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vet-clinic"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mongo:
    image: mongo:7.0
    ports:
      - "5020:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - vet-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7.2-alpine
    ports:
      - "5030:6379"
    networks:
      - vet-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "5040:9000"
      - "5041:9001"
    volumes:
      - minio-data:/data
    networks:
      - vet-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mqtt:
    image: eclipse-mosquitto:2.0
    ports:
      - "1883:1883"
    volumes:
    - ./volumes/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - vet-network
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/broker/uptime", "-C", "1", "-W", "1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.0
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/vet-clinic
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: 12345
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME: 192.168.1.114
      KC_HOSTNAME_STRICT: false
    command: start-dev
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vet-network
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /realms/master HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  python-ai:
    build: ./services/ai-model
    ports:
      - "8091:8091"
    environment:
      MODEL_PATH: /app/pet_health_model.pkl
      REDIS_HOST: ${REMOTE_HOST:-redis}
    volumes:
      - ./services/ai-model:/app
    networks:
      - vet-network

  appointment:
    build: ./services/appointment-service
    ports:
      - "8081:8081"
    environment:
      <<: *java-env
      KEYCLOAK_CLIENT_SECRET: KndP9iogTlX3TrdkzuPWgZYzztsp9o8D
      KEYCLOAK_EXTRA_ISSUER_URL: http://192.168.1.114:8080/realms/clinic-realm
      TG_BOT_HOST: ${REMOTE_HOST:-telegram-bot}
      TG_BOT_PORT: 8090
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      profile:
        condition: service_started
    networks:
      - vet-network

  management:
    build: ./services/management-service
    ports:
      - "8082:8082"
    environment:
      <<: *java-env
      KEYCLOAK_CLIENT_SECRET: your-management-secret
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - vet-network

  profile:
    build: ./services/profile-service
    ports:
      - "8083:8083"
    environment:
      <<: *java-env
      KEYCLOAK_CLIENT_SECRET: your-profile-secret
    depends_on:
      mongo:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - vet-network

  pet-health-analyzer:
    build: ./services/pet-health-analyzer-service
    ports:
      - "8084:8084"
    environment:
      <<: *java-env
      KEYCLOAK_CLIENT_SECRET: KndP9iogTlX3TrdkzuPWgZYzztsp9o8D
      MQTT_BROKER: tcp://${REMOTE_HOST:-mqtt}:1883
      MQTT_HOST: ${REMOTE_HOST:-mqtt}
      MQTT_PORT: 1883
      MINIO_HOST: ${REMOTE_HOST:-minio}
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      mqtt:
        condition: service_healthy
      python-ai:
        condition: service_started
    networks:
      - vet-network

  pet-wearable:
    build: ./services/petwearable-service
    ports:
      - "8085:8085"
    environment:
      <<: *java-env
      KEYCLOAK_CLIENT_SECRET: cJmrhLBTXL2g9oZlfdjVMVQ2eycb3dmY
      MQTT_BROKER: tcp://${REMOTE_HOST:-mqtt}:1883
      MQTT_HOST: ${REMOTE_HOST:-mqtt}
      MQTT_PORT: 1883
    depends_on:
      mqtt:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      profile:
        condition: service_started
    networks:
      - vet-network

  clinic-bot:
    build: ./services/bot-service
    ports:
      - "8090:8090"
    environment:
      <<: *java-env
      KEYCLOAK_CLIENT_SECRET: MnRm2WcQMWruSA09qH2jpL9dwwF45ijx
      MQTT_HOST: ${REMOTE_HOST:-mqtt}
      MQTT_PORT: 1883
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      mqtt:
        condition: service_healthy
      profile:
        condition: service_started
    networks:
      - vet-network

  vet-gateway:
    build: ./services/vet-gateway
    ports:
      - "8888:8888"
    environment:
      <<: *java-env
      KEYCLOAK_CLIENT_SECRET: oy3FdqCED7Wi4BPX7JZ0Y3ils24UopsR
      APPOINTMENT_HOST: ${REMOTE_HOST:-appointment}
      APPOINTMENT_PORT: 8081
      MANAGEMENT_HOST: ${REMOTE_HOST:-management}
      MANAGEMENT_PORT: 8082
      PROFILE_HOST: ${REMOTE_HOST:-profile}
      PROFILE_PORT: 8083
      HEALTH_HOST: ${REMOTE_HOST:-pet-health-analyzer}
      HEALTH_PORT: 8084
      TELEGRAM_HOST: ${REMOTE_HOST:-clinic-bot}
      TELEGRAM_PORT: 8090
      PYTHON_HOST: ${REMOTE_HOST:-python-ai}
      PYTHON_PORT: 8091
    depends_on:
      management:
        condition: service_started
      profile:
        condition: service_started
      keycloak:
        condition: service_healthy
    networks:
      - vet-network

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: HLZUx8ifGW+9pT1Xh0v7tln8706sYj+++i2DSXxbruY=
      KEYCLOAK_ISSUER: http://192.168.1.114:8080/realms/clinic-realm
      KEYCLOAK_CLIENT_ID: vet-frontend
      KEYCLOAK_CLIENT_SECRET: Gv1nqQU8imIrxFxQrI9N7Dk0RZqiZ5lQ
      KEYCLOAK_ADMIN_CLIENT_ID: profile-service
      KEYCLOAK_ADMIN_CLIENT_SECRET: Xl2WP6TD01qkB5Lmd5abECck6VxlGBtk
      KEYCLOAK_REALM: clinic-realm
      KEYCLOAK_BASE_URL: http://192.168.1.114:8080
      NEXT_PUBLIC_API_URL: http://${REMOTE_HOST:-vet-gateway}:8888
      API_URL_EXTERNAL: http://${REMOTE_HOST:-localhost}:8888
    networks:
      - vet-network

volumes:
  postgres-data:
  mongo-data:
  minio-data: